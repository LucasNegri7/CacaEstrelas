<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caça Estelar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Placar fixo no topo -->
  <div id="placar">
    <span>Pontos: <span id="pontos">0</span></span>
    <span>Tempo: <span id="tempo">30</span>s</span>
  </div>

  <!-- Tela inicial -->
  <div id="telaInicial" class="tela">
    <h1>🚀 Caça Estelar</h1>
    <p>Clique nos alvos antes que sumam. Cuidado com as bombas 💣: elas tiram pontos!</p>
    <button id="btnIniciar">Iniciar</button>
  </div>

  <!-- Tela de fim de jogo (escondida no início) -->
  <div id="telaFim" class="tela escondida">
    <h1>Fim de jogo!</h1>
    <p>Você fez <strong id="pontosFinais">0</strong> pontos.</p>
    <button id="btnReiniciar">Jogar novamente</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
